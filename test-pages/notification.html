<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sagi Block 通知許可テスト</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif;
      background: #101820;
      color: #f4f7fb;
    }
    main {
      width: min(720px, calc(100vw - 40px));
      padding: 34px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      background: #172432;
      box-shadow: 0 30px 80px rgba(0,0,0,.36);
    }
    h1 { margin-top: 0; }
    p { line-height: 1.75; color: #cdd7e2; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      margin-right: 10px;
      font-weight: 800;
      color: #101820;
      background: #91d5ff;
      cursor: pointer;
    }
    code {
      color: #ffe58f;
      background: rgba(255,255,255,.08);
      padding: 2px 6px;
      border-radius: 5px;
    }
    #status { margin-top: 22px; color: #ffe58f; }
  </style>
</head>
<body>
  <main>
    <h1>Sagi Block 通知許可テスト</h1>
    <p>このページは、詐欺通知を許可してしまった状態をローカルで再現するためのテストページです。</p>
    <p>ブラウザに通知許可を与えると、通知を表示します。Sagi Block 側で、この origin の通知許可を検出・ブロックできるか確認できます。</p>
    <p>URL例: <code>http://127.0.0.1:8765/notification.html</code></p>
    <button id="request">通知を許可する</button>
    <button id="send">テスト通知を出す</button>
    <p id="status"></p>
  </main>

  <script>
    const status = document.querySelector("#status");
    function setStatus(text) {
      status.textContent = text;
    }

    document.querySelector("#request").addEventListener("click", async () => {
      if (!("Notification" in window)) {
        setStatus("このブラウザはNotification APIに対応していません。");
        return;
      }
      const result = await Notification.requestPermission();
      setStatus(`通知権限: ${result}`);
    });

    document.querySelector("#send").addEventListener("click", () => {
      if (!("Notification" in window)) {
        setStatus("このブラウザはNotification APIに対応していません。");
        return;
      }
      if (Notification.permission !== "granted") {
        setStatus("先に通知を許可してください。");
        return;
      }
      new Notification("Sagi Block テスト通知", {
        body: "これはローカルの疑似通知です。本物の詐欺通知ではありません。"
      });
      setStatus("通知を送信しました。");
    });
  </script>
</body>
</html>
